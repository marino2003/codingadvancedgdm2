<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactieve Wereldkaart</title>
    <link rel="stylesheet" href="/src/reset.css">
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <div class="layout-wrapper">

        <main class="container">
            <header class="main-header">
                <h1>Steden en Temperaturen</h1>
                <p>Hover voor temp, Klik voor info</p>
            </header>
            <div class="canvas-container">
                <canvas id="earthCanvas"></canvas>
            </div>
             <footer class="main-footer">
                 <p>&copy; 2025 - Marijn Pieper - 2GDM</p>
             </footer>
        </main>

        <div id="cityInfoModal" class="modal">
            <div class="modal-content">
                <span class="close-button">&times;</span>
                <h2 id="displayCityName">Selecteer een stad</h2>
                <p id="displayCityTemp">Temperatuur: --°C</p>
                <div id="displayImageGallery" class="image-gallery">
                    <p>Klik op een stad op de kaart.</p>
                </div>
            </div>
        </div>

    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
